<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanează jocul</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#fff;color:#1e293b;font-family:system-ui,sans-serif;text-align:center}
h1{font-size:44px;margin:0} #qr{padding:18px;background:#fff} p{font-size:18px;margin:0;color:#475569}
</style></head><body>
<h1>📱 Scanează și joacă!</h1>
<div id="qr"></div>
<p id="u"></p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const URL_JOC = "https://alex-glitch-lab.github.io/jocul-clasei/";
new QRCode(document.getElementById('qr'), {text: URL_JOC, width: 420, height: 420, correctLevel: QRCode.CorrectLevel.M});
document.getElementById('u').textContent = URL_JOC;
</script></body></html>
