<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jocul Clasei</title>
<style>
  :root { --bg1:#7dd3fc; --bg2:#fef3c7; --ink:#1e293b; --btn:#f97316; }
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;top:0;left:0;right:0;bottom:0;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:var(--bg1);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
  #world{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden}
  .sp{position:absolute;left:0;top:0;line-height:1;will-change:transform;pointer-events:none}
  #dbg{position:fixed;left:8px;right:8px;top:52px;z-index:8;background:rgba(0,0,0,.7);color:#fff;font:13px/1.3 monospace;padding:6px 8px;border-radius:6px}
  #err{position:fixed;left:8px;right:8px;bottom:8px;z-index:9;background:#b91c1c;color:#fff;font:14px/1.3 monospace;padding:10px;border-radius:8px;white-space:pre-wrap}
  #ver{position:fixed;right:8px;bottom:6px;font-size:12px;opacity:.5;z-index:3}
  #hud{position:fixed;z-index:1;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 16px;font-size:22px;font-weight:800;pointer-events:none}
  .screen{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px;background:rgba(255,255,255,.88)}
  .screen h1{font-size:34px;margin:0}
  .screen p{font-size:20px;margin:0;max-width:420px;line-height:1.35}
  .big{font-size:64px}
  button{font:inherit;font-size:24px;font-weight:800;color:#fff;background:var(--btn);border:0;border-radius:16px;padding:14px 34px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
  .hidden{display:none}
</style>
</head>
<body>
<div id="world"></div>
<div id="err" class="hidden"></div>
<div id="ver">v3</div>
<div id="dbg" class="hidden"></div>
<div id="hud"><span id="score">⭐ 0</span><span id="lives">❤️❤️❤️</span></div>

<div id="start" class="screen">
  <div class="big" id="startHero"></div>
  <h1 id="title"></h1>
  <p id="howto"></p>
  <button id="go">Start!</button>
</div>

<div id="end" class="screen hidden">
  <div class="big">🏁</div>
  <h1>Gata jocul!</h1>
  <p id="final"></p>
  <p>Acum pune telefonul jos și spune-i colegului tău scorul 😄</p>
  <button id="again">Încă o dată</button>
</div>

<script>
// Orice eroare apare pe ecran (roșu), ca s-o putem vedea pe telefon.
window.onerror = function (msg, src, line) { var b = document.getElementById('err'); b.textContent = 'Eroare: ' + msg + ' (linia ' + line + ')'; b.classList.remove('hidden'); };
// ======== SETĂRILE JOCULUI — aici schimbăm ce aleg copiii ========
const JOC = {
  titlu:      "Jocul Clasei a III-a",
  erou:       "🐱",          // cine suntem noi
  bune:       ["🐟", "🍕"],  // ce prindem (+1 punct)
  rele:       ["💣"],        // de ce ne ferim (-1 viață)
  bonus:      "⭐",          // rar: +5 puncte
  culoareSus: "#7dd3fc",     // cerul
  culoareJos: "#fef3c7",     // pământul
  vieti:      3,
  viteza:     1.0,           // 1 = normal, 2 = foarte repede
};
// ================================================================

// Desenăm cu elemente HTML (nu canvas): emoji-urile apar sigur pe orice telefon.
const world = document.getElementById('world');
let W, H, hero = { x: 0, y: 0, el: null }, items = [], score = 0, lives = 0, t0, last, running = false, spawnAcc = 0;
const $ = id => document.getElementById(id);
const DEBUG = /[?&]debug/.test(location.search);
let frames = 0, touches = 0;

function setup() {
  document.title = JOC.titlu;
  $('title').textContent = JOC.titlu;
  $('startHero').textContent = JOC.erou;
  $('howto').innerHTML = `Mută ${JOC.erou} cu degetul.<br>Prinde ${JOC.bune.join(' ')} · ferește-te de ${JOC.rele.join(' ')}`;
  document.documentElement.style.setProperty('--bg1', JOC.culoareSus);
  world.style.background = `linear-gradient(${JOC.culoareSus}, ${JOC.culoareJos})`;
  hero.el = sprite(JOC.erou, 1.25);
  if (DEBUG) $('dbg').classList.remove('hidden');
}
function resize() { W = innerWidth; H = innerHeight; }
function size() { return Math.max(36, Math.min(W, H) * 0.11); }
function sprite(e, k) {
  const d = document.createElement('div');
  d.className = 'sp'; d.textContent = e; d.style.fontSize = (size() * (k || 1)) + 'px';
  world.appendChild(d); return d;
}
function place(o) { o.el.style.transform = `translate(${o.x}px, ${o.y}px) translate(-50%, -50%)`; }

function start() {
  if (running) return;
  for (const it of items) it.el.remove();
  hero.x = W / 2; hero.y = H - size() * 1.2; hero.el.style.fontSize = size() * 1.25 + 'px'; place(hero);
  items = []; score = 0; lives = JOC.vieti; spawnAcc = 0;
  t0 = last = performance.now(); running = true;
  $('start').classList.add('hidden'); $('end').classList.add('hidden');
  hud(); requestAnimationFrame(loop);
}
function end() {
  running = false;
  $('final').textContent = `Ai strâns ${score} puncte!`;
  $('end').classList.remove('hidden');
}
function hud() {
  $('score').textContent = '⭐ ' + score;
  $('lives').textContent = lives > 0 ? '❤️'.repeat(lives) : '💔';
}
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function spawn(elapsed) {
  const r = Math.random();
  const kind = r < 0.04 ? 'bonus' : r < 0.32 ? 'rea' : 'buna';
  const e = kind === 'bonus' ? JOC.bonus : kind === 'rea' ? pick(JOC.rele) : pick(JOC.bune);
  const base = H * (0.25 + elapsed * 0.006) * JOC.viteza;   // devine tot mai greu
  const it = { e, kind, x: size() / 2 + Math.random() * (W - size()), y: -size(), v: base * (0.8 + Math.random() * 0.5) };
  it.el = sprite(e); place(it); items.push(it);
}

function loop(now) {
  if (!running) return;
  frames++;
  const dt = Math.max(0, Math.min((now - last) / 1000, 0.05)); last = now;
  const elapsed = (now - t0) / 1000;
  spawnAcc += dt;
  const every = Math.max(0.35, 0.9 - elapsed * 0.012) / JOC.viteza;
  while (spawnAcc > every) { spawnAcc -= every; spawn(elapsed); }

  const s = size();
  for (const it of items) {
    it.y += it.v * dt;
    if (!it.hit && Math.abs(it.x - hero.x) < s * 0.75 && Math.abs(it.y - hero.y) < s * 0.75) {
      it.hit = true;
      if (it.kind === 'buna') score += 1;
      else if (it.kind === 'bonus') score += 5;
      else { lives -= 1; if (navigator.vibrate) navigator.vibrate(120); }
      hud();
    }
  }
  items = items.filter(it => { const keep = !it.hit && it.y < H + s; if (!keep) it.el.remove(); else place(it); return keep; });
  place(hero);
  if (DEBUG) $('dbg').textContent = `cadre ${frames} · obiecte ${items.length} · atingeri ${touches} · ${W}×${H} · ${navigator.userAgent.match(/OS [\d_]+/) || ''}`;
  if (lives <= 0) return end();
  requestAnimationFrame(loop);
}

function move(e) {
  if (!running) return;
  touches++;
  const p = e.touches ? e.touches[0] : e;
  hero.x = Math.max(size() / 2, Math.min(W - size() / 2, p.clientX));
  e.preventDefault();
}
addEventListener('touchstart', move, { passive: false });
addEventListener('touchmove', move, { passive: false });
addEventListener('mousemove', move);
addEventListener('keydown', e => {
  if (!running) return;
  if (e.key === 'ArrowLeft') hero.x = Math.max(size() / 2, hero.x - W * 0.08);
  if (e.key === 'ArrowRight') hero.x = Math.min(W - size() / 2, hero.x + W * 0.08);
});
addEventListener('resize', () => { resize(); hero.y = H - size() * 1.2; place(hero); });
// Pe iPhone pornim la atingere (touchend), nu așteptăm click-ul.
function tapButton(el) {
  el.addEventListener('touchend', function (e) { e.preventDefault(); e.stopPropagation(); start(); }, { passive: false });
  el.addEventListener('click', start);
}
tapButton($('go')); tapButton($('again'));

resize(); setup(); hero.x = W / 2; hero.y = H - size() * 1.2; place(hero);
</script>
</body>
</html>
