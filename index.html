<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jocul Clasei</title>
<style>
  :root { --bg1:#7dd3fc; --bg2:#fef3c7; --ink:#1e293b; --btn:#f97316; }
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:var(--bg1);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 16px;font-size:22px;font-weight:800;pointer-events:none}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px;background:rgba(255,255,255,.88)}
  .screen h1{font-size:34px;margin:0}
  .screen p{font-size:20px;margin:0;max-width:420px;line-height:1.35}
  .big{font-size:64px}
  button{font:inherit;font-size:24px;font-weight:800;color:#fff;background:var(--btn);border:0;border-radius:16px;padding:14px 34px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
  .hidden{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="score">⭐ 0</span><span id="lives">❤️❤️❤️</span></div>

<div id="start" class="screen">
  <div class="big" id="startHero"></div>
  <h1 id="title"></h1>
  <p id="howto"></p>
  <button id="go">Start!</button>
</div>

<div id="end" class="screen hidden">
  <div class="big">🏁</div>
  <h1>Gata jocul!</h1>
  <p id="final"></p>
  <p>Acum pune telefonul jos și spune-i colegului tău scorul 😄</p>
  <button id="again">Încă o dată</button>
</div>

<script>
// ======== SETĂRILE JOCULUI — aici schimbăm ce aleg copiii ========
const JOC = {
  titlu:      "Jocul Clasei a III-a",
  erou:       "🐱",          // cine suntem noi
  bune:       ["🐟", "🍕"],  // ce prindem (+1 punct)
  rele:       ["💣"],        // de ce ne ferim (-1 viață)
  bonus:      "⭐",          // rar: +5 puncte
  culoareSus: "#7dd3fc",     // cerul
  culoareJos: "#fef3c7",     // pământul
  vieti:      3,
  viteza:     1.0,           // 1 = normal, 2 = foarte repede
};
// ================================================================

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR, hero, items, score, lives, t0, last, running = false, spawnAcc = 0;
const $ = id => document.getElementById(id);

function setup() {
  document.title = JOC.titlu;
  $('title').textContent = JOC.titlu;
  $('startHero').textContent = JOC.erou;
  $('howto').innerHTML = `Mută ${JOC.erou} cu degetul.<br>Prinde ${JOC.bune.join(' ')} · ferește-te de ${JOC.rele.join(' ')}`;
  document.documentElement.style.setProperty('--bg1', JOC.culoareSus);
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';   // iPhone: bara de adrese schimbă înălțimea
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function size() { return Math.max(36, Math.min(W, H) * 0.11); }

function start() {
  hero = { x: W / 2, y: H - size() * 1.2 };
  items = []; score = 0; lives = JOC.vieti; spawnAcc = 0;
  t0 = last = performance.now(); running = true;
  $('start').classList.add('hidden'); $('end').classList.add('hidden');
  hud(); requestAnimationFrame(loop);
}
function end() {
  running = false;
  $('final').textContent = `Ai strâns ${score} puncte!`;
  $('end').classList.remove('hidden');
}
function hud() {
  $('score').textContent = '⭐ ' + score;
  $('lives').textContent = lives > 0 ? '❤️'.repeat(lives) : '💔';
}
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function spawn(elapsed) {
  const r = Math.random();
  let kind = r < 0.04 ? 'bonus' : r < 0.32 ? 'rea' : 'buna';
  const e = kind === 'bonus' ? JOC.bonus : kind === 'rea' ? pick(JOC.rele) : pick(JOC.bune);
  const base = H * (0.25 + elapsed * 0.006) * JOC.viteza;   // devine tot mai greu
  items.push({ e, kind, x: size() / 2 + Math.random() * (W - size()), y: -size(), v: base * (0.8 + Math.random() * 0.5) });
}

function loop(now) {
  if (!running) return;
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const elapsed = (now - t0) / 1000;
  spawnAcc += dt;
  const every = Math.max(0.35, 0.9 - elapsed * 0.012) / JOC.viteza;
  while (spawnAcc > every) { spawnAcc -= every; spawn(elapsed); }

  const s = size();
  for (const it of items) {
    it.y += it.v * dt;
    if (!it.hit && Math.abs(it.x - hero.x) < s * 0.75 && Math.abs(it.y - hero.y) < s * 0.75) {
      it.hit = true;
      if (it.kind === 'buna') score += 1;
      else if (it.kind === 'bonus') score += 5;
      else { lives -= 1; if (navigator.vibrate) navigator.vibrate(120); }
      hud();
    }
  }
  items = items.filter(it => !it.hit && it.y < H + s);
  draw();
  if (lives <= 0) return end();
  requestAnimationFrame(loop);
}

function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, JOC.culoareSus); g.addColorStop(1, JOC.culoareJos);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const s = size();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `${s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  for (const it of items) ctx.fillText(it.e, it.x, it.y);
  ctx.font = `${s * 1.25}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.fillText(JOC.erou, hero.x, hero.y);
}

function move(e) {
  if (!running) return;
  const p = e.touches ? e.touches[0] : e;
  hero.x = Math.max(size() / 2, Math.min(W - size() / 2, p.clientX));
  e.preventDefault();
}
addEventListener('touchstart', move, { passive: false });
addEventListener('touchmove', move, { passive: false });
addEventListener('mousemove', move);
addEventListener('keydown', e => {
  if (!running) return;
  if (e.key === 'ArrowLeft') hero.x = Math.max(size() / 2, hero.x - W * 0.08);
  if (e.key === 'ArrowRight') hero.x = Math.min(W - size() / 2, hero.x + W * 0.08);
});
addEventListener('resize', () => { resize(); if (hero) hero.y = H - size() * 1.2; });
$('go').onclick = start; $('again').onclick = start;

resize(); setup(); draw();
</script>
</body>
</html>
